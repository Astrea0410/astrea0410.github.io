<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Programming 학습 자료</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            background: #0d0f18;
            color: #e8ecf5;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        main {
            width: min(100%, 560px);
            padding: 36px;
            border: 1px solid #2a2d3e;
            border-radius: 20px;
            background: #181b28;
        }

        .label {
            color: #e5c07b;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
        }

        p {
            color: #a4abc0;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            color: #e5c07b;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main>
        <div class="label">JAVA PROGRAMMING</div>
        <h1>Java 학습 자료</h1>
        <p>Java 프로그래밍 수업 실습과 학습 자료를 이곳에서 확인할 수 있습니다.</p>
        <p>자료를 준비 중입니다.</p>
        <a href="../index.html">← 메인 페이지로 돌아가기</a>
    </main>
</body>

</html>
