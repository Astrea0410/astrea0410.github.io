<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 크기</title>
    <style>
        canvas {
            border: 10px dotted black;
        }
    </style>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>
<p id="canvasSize"></p>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");
document.getElementById("canvasSize").textContent =
    `캔버스 크기: ${canvas.width} × ${canvas.height} px`;
//선그리기
ctx.beginPath();
ctx.moveTo(50, 140);
ctx.lineTo(180, 35);
ctx.lineTo(310, 140);
ctx.strokeStyle = "blue";
ctx.lineWidth = 5;
ctx.stroke();

ctx.beginPath();
ctx.moveTo(310, 140);
ctx.lineTo(400, 140);
ctx.lineTo(400, 250);
ctx.lineTo(310, 250);
ctx.lineTo(310, 140);
ctx.strokeStyle = "black";
ctx.lineWidth = 5;
ctx.stroke();
</script>

</body>
</html>
