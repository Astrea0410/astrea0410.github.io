<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 크기</title>
    <style>
        canvas {
            border: 10px dotted black;
        }
    </style>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>
<p id="canvasSize"></p>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");
document.getElementById("canvasSize").textContent =
    `캔버스 크기: ${canvas.width} × ${canvas.height} px`;

//원그리기
ctx.beginPath();
ctx.arc(180, 95, 60, 0, Math.PI * 2);
ctx.fillStyle = "orange";
ctx.fill();
ctx.strokeStyle = "#333";
ctx.stroke();

ctx.beginPath();
ctx.arc(400, 95, 60, -Math.PI / 2, Math.PI / 2);
ctx.closePath();
ctx.fillStyle = "red";
ctx.fill();
ctx.strokeStyle = "#333";
ctx.stroke();

ctx.beginPath();
ctx.arc(60, 270, 35, 0, Math.PI * 2);
ctx.strokeStyle = "green";
ctx.lineWidth = 4;
ctx.stroke();

ctx.beginPath();
ctx.arc(180, 270, 35, Math.PI, Math.PI * 2);
ctx.closePath();
ctx.fillStyle = "blue";
ctx.fill();

ctx.beginPath();
ctx.moveTo(300, 270);
ctx.arc(300, 270, 35, 0, Math.PI / 2);
ctx.closePath();
ctx.fillStyle = "purple";
ctx.fill();

ctx.beginPath();
ctx.arc(420, 270, 35, 0, Math.PI * 2);
ctx.strokeStyle = "teal";
ctx.lineWidth = 12;
ctx.stroke();

ctx.beginPath();
ctx.moveTo(540, 270);
ctx.arc(540, 270, 35, 0, Math.PI * 1.5);
ctx.closePath();
ctx.fillStyle = "gold";
ctx.fill();
</script>

</body>
</html>
