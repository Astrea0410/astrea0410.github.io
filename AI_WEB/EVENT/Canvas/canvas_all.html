<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 예제 통합 구조</title>
</head>
<body>
  <main>
    <h1>Canvas 예제 통합 실습</h1>
    <section><h2>기본 구조와 도형 예제</h2>
      <canvas id="shapeCanvas" width="600" height="420"></canvas>
    </section>
    <section><h2>애니메이션 예제</h2>
      <canvas id="animationCanvas" width="600" height="180"></canvas>
      <button id="startBtn" type="button">시작</button>
      <button id="pauseBtn" type="button">일시 정지</button>
      <button id="resetBtn" type="button">초기화</button>
    </section>
  </main>
  <script>
    // 하나의 Canvas에 사각형, 선, 원, 삼각형, 그라데이션, 텍스트, 회전을 통합합니다.
    const canvas = document.getElementById("shapeCanvas");
    const ctx = canvas.getContext("2d");

    // 사각형
    ctx.fillStyle = "skyblue";
    ctx.fillRect(30, 30, 120, 70);
    ctx.strokeStyle = "red";
    ctx.lineWidth = 4;
    ctx.strokeRect(175, 30, 120, 70);

    // 선
    ctx.beginPath();
    ctx.moveTo(330, 100);
    ctx.lineTo(390, 25);
    ctx.lineTo(450, 100);
    ctx.strokeStyle = "blue";
    ctx.lineWidth = 5;
    ctx.stroke();

    // 원
    ctx.beginPath();
    ctx.arc(95, 195, 45, 0, Math.PI * 2);
    ctx.fillStyle = "orange";
    ctx.fill();
    ctx.strokeStyle = "#333";
    ctx.stroke();

    // 삼각형
    ctx.beginPath();
    ctx.moveTo(245, 145);
    ctx.lineTo(195, 235);
    ctx.lineTo(295, 235);
    ctx.closePath();
    ctx.fillStyle = "gold";
    ctx.fill();
    ctx.stroke();

    // 그라데이션
    const gradient = ctx.createLinearGradient(340, 0, 560, 0);
    gradient.addColorStop(0, "red");
    gradient.addColorStop(0.5, "yellow");
    gradient.addColorStop(1, "blue");
    ctx.fillStyle = gradient;
    ctx.fillRect(330, 155, 230, 55);

    // 텍스트
    ctx.font = "bold 25px Arial";
    ctx.fillStyle = "navy";
    ctx.fillText("Hello Canvas!", 30, 300);
    ctx.font = "bold 23px Arial";
    ctx.strokeStyle = "tomato";
    ctx.strokeText("JavaScript", 30, 345);

    // 좌표 이동 및 회전
    ctx.save();
    ctx.translate(420, 300);
    ctx.rotate(Math.PI / 4); // 45도는 Math.PI / 4 라디안
    ctx.fillStyle = "purple";
    ctx.fillRect(-35, -35, 70, 70);
    ctx.restore();

    // requestAnimationFrame을 사용하는 이동·회전 애니메이션
    const movingCanvas = document.getElementById("animationCanvas");
    const movingCtx = movingCanvas.getContext("2d");
    let x = 60, angle = 0, direction = 1, animationId = null;

    function animate() {
      movingCtx.clearRect(0, 0, movingCanvas.width, movingCanvas.height);
      movingCtx.save();
      movingCtx.translate(x, 90);
      movingCtx.rotate(angle);
      movingCtx.fillStyle = "deepskyblue";
      movingCtx.fillRect(-30, -30, 60, 60);
      movingCtx.restore();
      x += 2 * direction;
      angle += 0.04;
      if (x > movingCanvas.width - 50 || x < 50) direction *= -1;
      animationId = requestAnimationFrame(animate);
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      if (animationId === null) animationId = requestAnimationFrame(animate);
    });
    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
      x = 60;
      angle = 0;
      direction = 1;
      movingCtx.clearRect(0, 0, movingCanvas.width, movingCanvas.height);
    });
  </script>
</body>
</html>
