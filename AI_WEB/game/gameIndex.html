<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="게임 개발 학습 자료와 게임 개발자 취업 로드맵">
<title>Game 학습 인덱스</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0d0f18;color:#e8ecf5;font-family:'Nanum Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;padding:3rem 1.5rem}
header{width:100%;text-align:center;padding:1rem 0 2rem}
.top-label{font:.75rem 'Nanum Gothic Coding',monospace;color:#4f8ef7;letter-spacing:.15em;margin-bottom:.8rem}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800;margin-bottom:.55rem}
h1 .hl{background:linear-gradient(90deg,#4f8ef7,#55d6a5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.desc{color:#7a84a3;font-size:.9rem}
.count{display:inline-block;margin-top:1rem;padding:.35rem .85rem;border:1px solid #3157a0;border-radius:30px;background:#172744;color:#76a8ff;font-size:.78rem}
main{width:100%;max-width:780px;border-top:1px solid #292d3d;margin-top:1rem;padding:2.3rem 0}
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.file{display:flex;align-items:center;gap:.85rem;min-width:0;padding:1rem 1.1rem;border-radius:13px;border:1px solid #2a2d3e;background:#1b1f2c;color:inherit;text-decoration:none;transition:.2s ease}
.file:hover{border-color:#4f8ef7;background:#22283a;transform:translateY(-3px)}
.file-icon{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;background:#1b3766;color:#70a5ff;font:700 .7rem 'Nanum Gothic Coding',monospace}
.file-text{flex:1;min-width:0}.file-name{font-size:.9rem;font-weight:700;overflow-wrap:anywhere}.file-desc{display:block;margin-top:.25rem;color:#7a91ba;font-size:.76rem}
.arrow{color:#6c7897}footer{color:#59627e;font-size:.76rem;text-align:center;margin:.4rem 0 1rem}
.back{display:inline-block;color:#779ee8;text-decoration:none;font-size:.82rem;margin-top:1rem}.back:hover{color:#a9c5ff}
@media(max-width:560px){body{padding:2rem 1rem}.files{grid-template-columns:1fr}main{padding-top:1.5rem}}
</style>
</head>
<body>
<header>
<p class="top-label">&lt;🎮 GAME FILE COLLECTION /&gt;</p>
<h1><span class="hl">Game</span> 학습 인덱스</h1>
<p class="desc">아래 파일을 클릭하여 게임 개발 학습 자료로 이동하세요.</p>
<span class="count">총 1개 파일</span>
</header>
<main>
<div class="files">
<a class="file" href="../game_developer_roadmap.html">
<span class="file-icon">GAME</span>
<span class="file-text">
<span class="file-name">game_developer_roadmap.html</span>
<span class="file-desc">게임 개발자 취업을 위한 15단계 로드맵</span>
</span>
<span class="arrow">→</span>
</a>
</div>
<a class="back" href="../AI_WEB.html">← 웹 개발 학습 자료로 돌아가기</a>
</main>
<footer>Game 학습 파일 인덱스 · 파일을 클릭하면 해당 학습 페이지로 이동합니다.</footer>
</body>
</html>
