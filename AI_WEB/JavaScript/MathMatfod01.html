<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="JavaScript Math와 String 메소드의 기능과 예시를 그래픽으로 설명합니다.">
    <title>JavaScript Math와 String 메소드</title>
    <style>
        :root {
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
            color: #233044;
            background: #f3f6fb;
            line-height: 1.65;
        }

        * {
            box-sizing: border-box;
        }

        body {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }

        h1 {
            margin: 0 0 8px;
            color: #173b70;
        }

        .intro {
            margin: 0;
            color: #53647b;
        }

        .section-title {
            margin: 34px 0 14px;
            color: #24599a;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
            gap: 16px;
        }

        .card {
            min-width: 0;
            padding: 18px;
            border: 1px solid #dfe7f1;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 4px 14px rgb(34 56 85 / 6%);
        }

        .card h3 {
            margin: 0;
            color: #24599a;
            font-size: 1.08rem;
        }

        .description {
            min-height: 3.3em;
            margin: 7px 0;
        }

        .example {
            margin: 8px 0 0;
            overflow-wrap: anywhere;
            color: #475569;
            font-size: 0.94rem;
        }

        code {
            padding: 2px 5px;
            border-radius: 4px;
            color: #8d351c;
            background: #fff1e9;
            font-family: Consolas, "Courier New", monospace;
        }

        figure {
            margin: 12px 0 0;
            padding: 8px;
            border-radius: 10px;
            background: #f5f8fc;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .axis {
            stroke: #95a4b8;
            stroke-width: 1.2;
        }

        .gridline {
            stroke: #dce4ee;
            stroke-dasharray: 3 4;
            stroke-width: 1;
        }

        .graph-line {
            fill: none;
            stroke: #3178c6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 3;
        }

        .moving-dot {
            fill: #f28a32;
            stroke: #fff;
            stroke-width: 2;
        }

        .flow-line {
            fill: none;
            stroke: #3178c6;
            stroke-linecap: round;
            stroke-width: 4;
        }

        .flow-node {
            fill: #fff;
            stroke: #3178c6;
            stroke-width: 2;
        }

        .svg-label {
            fill: #45566d;
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
            font-size: 12px;
        }

        figcaption {
            color: #53647b;
            font-size: 0.88rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .moving-dot {
                display: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 14px 40px;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>JavaScript Math와 String 메소드</h1>
        <p class="intro">각 메소드가 하는 일을 짧은 설명과 예시로 확인해 보세요. 수학 함수는 그래프 위의 점으로, 문자열 메소드는 실제 문자 처리 과정을 따라 움직이는 점으로 표현했습니다.</p>
    </header>

    <main>
        <h2 class="section-title">Math 메소드</h2>
        <div class="cards" id="math-cards"></div>

        <h2 class="section-title">String 메소드</h2>
        <div class="cards" id="string-cards"></div>
    </main>

    <script>
        const mathMethods = [
            {
                name: "Math.abs(x)",
                description: "숫자의 절댓값을 구합니다. 0에서 얼마나 떨어져 있는지 나타내며 결과는 음수가 아닙니다.",
                example: "Math.abs(-2.5) = 2.5",
                fn: Math.abs, domain: [-3, 3], range: [0, 3.2], caption: "음수도 0으로부터의 거리로 바꾸므로 그래프가 x축 위에 놓입니다."
            },
            {
                name: "Math.acos(x)",
                description: "코사인 값 x에 해당하는 각도를 라디안으로 구합니다. 입력은 -1부터 1까지입니다.",
                example: "Math.acos(0.5) ≈ 1.047 라디안",
                fn: Math.acos, domain: [-1, 1], range: [0, Math.PI], caption: "cos(각도) = x를 만족하는 각도를 돌려줍니다."
            },
            {
                name: "Math.acosh(x)",
                description: "쌍곡선 코사인의 역함수입니다. 입력은 1 이상이어야 합니다.",
                example: "Math.acosh(2) ≈ 1.317",
                fn: Math.acosh, domain: [1, 3], range: [0, 1.8], caption: "cosh(결과) = x가 되는 값을 구합니다. 정의역은 x ≥ 1입니다."
            },
            {
                name: "Math.asin(x)",
                description: "사인 값 x에 해당하는 각도를 라디안으로 구합니다. 입력은 -1부터 1까지입니다.",
                example: "Math.asin(0.5) ≈ 0.524 라디안",
                fn: Math.asin, domain: [-1, 1], range: [-Math.PI / 2, Math.PI / 2], caption: "sin(각도) = x를 만족하는 각도를 돌려줍니다."
            },
            {
                name: "Math.asinh(x)",
                description: "쌍곡선 사인의 역함수입니다. 모든 실수를 입력할 수 있습니다.",
                example: "Math.asinh(1) ≈ 0.881",
                fn: Math.asinh, domain: [-3, 3], range: [-2, 2], caption: "sinh(결과) = x가 되는 값을 구합니다."
            },
            {
                name: "Math.atan(x)",
                description: "탄젠트 값 x에 해당하는 각도를 라디안으로 구합니다.",
                example: "Math.atan(1) ≈ 0.785 라디안 (π/4)",
                fn: Math.atan, domain: [-4, 4], range: [-1.6, 1.6], caption: "tan(각도) = x를 만족하는 각도를 구하며 결과는 -π/2와 π/2 사이입니다."
            },
            {
                name: "Math.atan2(y, x)",
                description: "좌표 (x, y)가 가리키는 방향의 각도를 구합니다. 두 좌표의 부호로 사분면도 구분합니다.",
                example: "Math.atan2(1, 3) ≈ 0.322 라디안",
                fn: function (x) { return Math.atan2(1, x); },
                domain: [-3, 3], range: [0, Math.PI], caption: "y를 1로 고정하고 x를 움직일 때, 좌표가 가리키는 각도의 변화를 그렸습니다."
            },
            {
                name: "Math.cbrt(x)",
                description: "x의 세제곱근을 구합니다. 음수의 세제곱근도 계산할 수 있습니다.",
                example: "Math.cbrt(-8) = -2",
                fn: Math.cbrt, domain: [-4, 4], range: [-1.7, 1.7], caption: "그래프의 y값을 세 번 곱하면 x값이 됩니다."
            },
            {
                name: "Math.ceil(x)",
                description: "x보다 작지 않은 가장 작은 정수를 구합니다. 소수점이 있으면 다음 정수 방향으로 올림합니다.",
                example: "Math.ceil(1.2) = 2, Math.ceil(-1.2) = -1",
                fn: Math.ceil, step: true, domain: [-3, 3], range: [-3.5, 3.5], caption: "각 구간의 값을 다음 정수로 올리는 계단 모양 그래프입니다."
            },
            {
                name: "Math.round(x)",
                description: "가장 가까운 정수로 반올림합니다. 정확히 중간이면 양의 무한대 방향으로 반올림합니다.",
                example: "Math.round(1.5) = 2, Math.round(-1.5) = -1",
                fn: Math.round, step: true, domain: [-3.5, 3.5], range: [-4, 4], caption: "가까운 정수로 바뀌어 계단 모양으로 나타납니다."
            },
            {
                name: "Math.sin(x)",
                description: "각도 x(라디안)의 사인 값을 구합니다. 값은 -1부터 1까지 반복됩니다.",
                example: "Math.sin(Math.PI / 2) = 1",
                fn: Math.sin, domain: [-2 * Math.PI, 2 * Math.PI], range: [-1.3, 1.3], caption: "각도가 증가해도 사인 값은 -1과 1 사이에서 반복됩니다."
            },
            {
                name: "Math.sinh(x)",
                description: "x의 쌍곡선 사인을 구합니다. sin과 달리 값이 일정한 범위에 갇히지 않습니다.",
                example: "Math.sinh(1) ≈ 1.175",
                fn: Math.sinh, domain: [-2, 2], range: [-4, 4], caption: "원점을 지나며 입력의 절댓값이 커질수록 빠르게 증가합니다."
            },
            {
                name: "Math.sqrt(x)",
                description: "0 이상의 숫자 x의 제곱근을 구합니다. 결과를 제곱하면 x가 됩니다.",
                example: "Math.sqrt(9) = 3",
                fn: Math.sqrt, domain: [0, 4], range: [0, 2.2], caption: "각 그래프 점에서 y² = x가 성립합니다."
            },
            {
                name: "Math.tan(x)",
                description: "각도 x(라디안)의 탄젠트 값을 구합니다. 특정 각도에서는 값이 정의되지 않습니다.",
                example: "Math.tan(Math.PI / 4) ≈ 1",
                fn: Math.tan, domain: [-1.2, 1.2], range: [-3, 3], caption: "이 구간은 수직 점근선(-π/2, π/2)을 피해서 표시했습니다."
            },
            {
                name: "Math.tanh(x)",
                description: "x의 쌍곡선 탄젠트를 구합니다. 결과는 -1보다 크고 1보다 작습니다.",
                example: "Math.tanh(1) ≈ 0.762",
                fn: Math.tanh, domain: [-3, 3], range: [-1.2, 1.2], caption: "입력이 커질수록 그래프가 1에, 작아질수록 -1에 가까워집니다."
            },
            {
                name: "Math.trunc(x)",
                description: "소수 부분을 버리고 정수 부분만 남깁니다. 0 방향으로 잘라냅니다.",
                example: "Math.trunc(-1.8) = -1",
                fn: Math.trunc, step: true, domain: [-4, 4], range: [-4.5, 4.5], caption: "양수와 음수 모두 0 방향으로 소수 부분을 버립니다."
            }
        ];

        const text = "Hello, welcome, AI, Software";
        const stringMethods = [
            {
                name: "match(pattern)",
                description: "문자열에서 패턴과 일치하는 부분을 찾아 배열로 반환합니다. 일치하는 부분이 없으면 null을 반환합니다.",
                input: 'text.match("AI")',
                output: JSON.stringify(text.match("AI")),
                graphic: "match",
                caption: "문자열을 훑어 패턴과 일치하는 AI를 찾습니다."
            },
            {
                name: "search(pattern)",
                description: "패턴이 처음 나타나는 위치의 인덱스를 반환합니다. 글자 위치는 0부터 세며, 찾지 못하면 -1입니다.",
                input: 'text.search("Software")',
                output: String(text.search("Software")),
                graphic: "search",
                caption: "왼쪽에서 오른쪽으로 검색해 Software가 시작되는 인덱스 20을 찾습니다."
            },
            {
                name: "slice(start, end)",
                description: "start 위치부터 end 바로 앞까지 일부를 복사합니다. 원래 문자열은 바뀌지 않습니다.",
                input: 'text.slice(7, 12)',
                output: JSON.stringify(text.slice(7, 12)),
                graphic: "slice",
                caption: "인덱스 7은 포함하고 12는 포함하지 않아 welco를 가져옵니다."
            },
            {
                name: "split(separator)",
                description: "구분자가 나오는 곳에서 문자열을 나눠 배열을 만듭니다. 구분자 자체는 결과에 포함되지 않습니다.",
                input: 'text.split(" ")',
                output: JSON.stringify(text.split(" ")),
                graphic: "split",
                caption: "공백에서 나누어 네 조각으로 만들며, 쉼표는 각 조각 안에 남습니다."
            },
            {
                name: "toUpperCase()",
                description: "영문 소문자를 대문자로 바꾼 새 문자열을 반환합니다. 원래 문자열은 그대로입니다.",
                input: "text.toUpperCase()",
                output: JSON.stringify(text.toUpperCase()),
                graphic: "uppercase",
                caption: "소문자 영문자가 대문자로 바뀝니다. 공백과 문장부호는 유지됩니다."
            },
            {
                name: "toString()",
                description: "숫자 같은 값을 문자열로 변환합니다. 변환 뒤에는 숫자 계산 대신 문자열 처리가 가능합니다.",
                input: "(5678).toString()",
                output: JSON.stringify((5678).toString()),
                graphic: "toString",
                caption: "숫자 5678이 문자 '5678'로 변환됩니다. 모양은 같아도 자료형은 다릅니다."
            }
        ];

        function mapX(value, domain, width, padding) {
            return padding + (value - domain[0]) / (domain[1] - domain[0]) * (width - padding * 2);
        }

        function mapY(value, range, height, padding) {
            return height - padding - (value - range[0]) / (range[1] - range[0]) * (height - padding * 2);
        }

        function makeGraph(method, index) {
            const width = 300;
            const height = 145;
            const padding = 22;
            const samples = 100;
            const points = [];

            for (let i = 0; i <= samples; i++) {
                const x = method.domain[0] + (method.domain[1] - method.domain[0]) * i / samples;
                let y = method.fn(x);
                if (!Number.isFinite(y)) {
                    continue;
                }
                y = Math.max(method.range[0], Math.min(method.range[1], y));
                points.push([mapX(x, method.domain, width, padding), mapY(y, method.range, height, padding)]);
            }

            let path = "";
            if (method.step) {
                for (let i = 0; i < points.length; i++) {
                    const point = points[i];
                    path += (i === 0 ? "M" : "L") + point[0].toFixed(2) + " " + point[1].toFixed(2);
                    if (i < points.length - 1) {
                        path += " H" + points[i + 1][0].toFixed(2);
                    }
                }
            } else {
                path = points.map(function (point, i) {
                    return (i === 0 ? "M" : "L") + point[0].toFixed(2) + " " + point[1].toFixed(2);
                }).join(" ");
            }

            const xAxisY = method.range[0] <= 0 && method.range[1] >= 0
                ? mapY(0, method.range, height, padding)
                : height - padding;
            const yAxisX = method.domain[0] <= 0 && method.domain[1] >= 0
                ? mapX(0, method.domain, width, padding)
                : padding;
            const motionPathId = "motion-path-" + index;

            return '<svg viewBox="0 0 300 145" role="img" aria-labelledby="graph-title-' + index + ' graph-desc-' + index + '">' +
                '<title id="graph-title-' + index + '">' + method.name + ' 함수 그래프</title>' +
                '<desc id="graph-desc-' + index + '">' + method.caption + ' 주황색 점이 그래프 선을 따라 움직입니다.</desc>' +
                '<path class="gridline" d="M' + padding + ' ' + (height / 2) + ' H' + (width - padding) + '"/>' +
                '<path class="axis" d="M' + padding + ' ' + xAxisY.toFixed(2) + ' H' + (width - padding) +
                ' M' + yAxisX.toFixed(2) + ' ' + padding + ' V' + (height - padding) + '"/>' +
                '<path class="graph-line" d="' + path + '"/>' +
                '<path id="' + motionPathId + '" d="' + path + '" fill="none" stroke="none"/>' +
                '<circle class="moving-dot" r="6"><animateMotion dur="4s" repeatCount="indefinite" path="' + path + '"/></circle>' +
                '<text class="svg-label" x="' + padding + '" y="13">y = ' + method.name.replace("Math.", "").replace("(x)", "(x)") + '</text>' +
                '</svg>';
        }

        function renderMathMethods() {
            const container = document.getElementById("math-cards");
            container.innerHTML = mathMethods.map(function (method, index) {
                const exampleResult = method.name === "Math.atan2(y, x)"
                    ? Math.atan2(1, 3).toFixed(3)
                    : method.name === "Math.acos(x)" || method.name === "Math.asin(x)" || method.name === "Math.atan(x)" || method.name === "Math.tan(x)"
                        ? method.example.split(" = ")[1]
                        : "";
                const example = method.name === "Math.atan2(y, x)"
                    ? "Math.atan2(1, 3) ≈ " + exampleResult + " 라디안"
                    : method.example;

                return '<article class="card">' +
                    '<h3><code>' + method.name + '</code></h3>' +
                    '<p class="description">' + method.description + '</p>' +
                    '<p class="example"><strong>예시:</strong> <code>' + example + '</code></p>' +
                    '<figure>' + makeGraph(method, index) + '<figcaption>' + method.caption + '</figcaption></figure>' +
                    '</article>';
            }).join("");
        }

        function renderStringMethods() {
            const container = document.getElementById("string-cards");
            container.innerHTML = stringMethods.map(function (method, index) {
                let visual;
                if (method.graphic === "match") {
                    visual = '<text class="svg-label" x="14" y="16">문자열에서 일치하는 글자 찾기</text>' +
                        '<text class="svg-label" x="30" y="48">Hello, welcome, </text>' +
                        '<rect x="134" y="31" width="23" height="23" rx="4" fill="#ffe0bd" stroke="#e18331"/>' +
                        '<text class="svg-label" x="139" y="48">AI</text>' +
                        '<text class="svg-label" x="160" y="48">, Software</text>' +
                        '<path class="flow-line" d="M22 63 H272"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M22 63 H272"/></circle>';
                } else if (method.graphic === "search") {
                    visual = '<text class="svg-label" x="14" y="16">찾은 단어의 시작 위치</text>' +
                        '<text class="svg-label" x="22" y="43">H e l l o ,   w e l c o m e ,   A I ,  </text>' +
                        '<rect x="217" y="26" width="65" height="24" rx="4" fill="#ffe0bd" stroke="#e18331"/>' +
                        '<text class="svg-label" x="221" y="43">Software</text>' +
                        '<path class="flow-line" d="M22 64 H220"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="3.5s" repeatCount="indefinite" path="M22 64 H220"/></circle>' +
                        '<text class="svg-label" x="209" y="76">index 20</text>';
                } else if (method.graphic === "slice") {
                    visual = '<text class="svg-label" x="14" y="16">인덱스 7부터 12 직전까지 선택</text>' +
                        '<text class="svg-label" x="19" y="44">Hello, </text>' +
                        '<rect x="62" y="27" width="53" height="24" rx="4" fill="#d9f3e5" stroke="#35a16a"/>' +
                        '<text class="svg-label" x="66" y="44">welco</text>' +
                        '<text class="svg-label" x="117" y="44">me, AI, Software</text>' +
                        '<path class="flow-line" d="M63 63 H114"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="1.8s" repeatCount="indefinite" path="M63 63 H114"/></circle>' +
                        '<text class="svg-label" x="58" y="78">7 포함</text><text class="svg-label" x="100" y="78">12 제외</text>';
                } else if (method.graphic === "split") {
                    visual = '<text class="svg-label" x="14" y="15">공백(" ")에서 나누기</text>' +
                        '<text class="svg-label" x="17" y="39">Hello,</text><text class="svg-label" x="80" y="39">welcome,</text>' +
                        '<text class="svg-label" x="166" y="39">AI,</text><text class="svg-label" x="212" y="39">Software</text>' +
                        '<path class="flow-line" d="M20 55 H276"/>' +
                        '<path d="M72 48 V61 M158 48 V61 M203 48 V61" stroke="#e18331" stroke-width="2"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M20 55 H276"/></circle>' +
                        '<text class="svg-label" x="25" y="74">배열의 각 항목</text>';
                } else if (method.graphic === "uppercase") {
                    visual = '<text class="svg-label" x="14" y="16">변환 전</text><text class="svg-label" x="207" y="16">변환 후</text>' +
                        '<text class="svg-label" x="14" y="43">Hello, welcome, AI</text>' +
                        '<path class="flow-line" d="M24 55 H276"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="2.5s" repeatCount="indefinite" path="M24 55 H276"/></circle>' +
                        '<text class="svg-label" x="14" y="74">HELLO, WELCOME, AI</text>';
                } else {
                    visual = '<text class="svg-label" x="20" y="17">숫자 (number)</text><text class="svg-label" x="207" y="17">문자열 (string)</text>' +
                        '<text class="svg-label" x="38" y="50">5678</text>' +
                        '<path class="flow-line" d="M24 59 H276"/>' +
                        '<circle class="moving-dot" r="5"><animateMotion dur="2.5s" repeatCount="indefinite" path="M24 59 H276"/></circle>' +
                        '<text class="svg-label" x="215" y="50">"5678"</text>' +
                        '<text class="svg-label" x="66" y="77">숫자  +  1  =  5679</text><text class="svg-label" x="200" y="77">문자  +  "1"  =  "56781"</text>';
                }

                return '<article class="card">' +
                    '<h3><code>String.' + method.name + '</code></h3>' +
                    '<p class="description">' + method.description + '</p>' +
                    '<p class="example"><strong>입력:</strong> <code>' + method.input + '</code></p>' +
                    '<p class="example"><strong>결과:</strong> <code>' + method.output + '</code></p>' +
                    '<figure>' +
                    '<svg viewBox="0 0 300 88" role="img" aria-labelledby="flow-title-' + index + '">' +
                    '<title id="flow-title-' + index + '">' + method.name + ': ' + method.caption + '</title>' +
                    visual +
                    '</svg>' +
                    '<figcaption>' + method.caption + '</figcaption>' +
                    '</figure>' +
                    '</article>';
            }).join("");
        }

        renderMathMethods();
        renderStringMethods();
    </script>
</body>
</html>
