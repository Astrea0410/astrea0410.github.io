<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 과목 인덱스</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0f18;
            color: #e8ecf5;
            font-family: 'Nanum Gothic', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        .top-label {
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.75rem;
            color: #555e7a;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 0.6rem;
        }

        h1 .hl {
            background: linear-gradient(90deg, #4f8ef7, #c678dd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .desc {
            text-align: center;
            font-size: 0.9rem;
            color: #7a84a3;
            margin-bottom: 3rem;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 520px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: #181b28;
            border: 1px solid #2a2d3e;
            border-radius: 16px;
            padding: 1.4rem 1.6rem;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 16px 0 0 16px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            border-color: var(--accent);
            background: #1e2133;
            transform: translateX(4px);
        }

        .card:hover::before {
            opacity: 1;
        }

        .icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--icon-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'Nanum Gothic Coding', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .card-text {
            flex: 1;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e8ecf5;
            margin-bottom: 0.25rem;
        }

        .card-sub {
            font-size: 0.8rem;
            color: #7a84a3;
        }

        .card-arrow {
            font-size: 1.1rem;
            color: #3a3f57;
            transition: color 0.2s, transform 0.2s;
        }

        .card:hover .card-arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* 각 카드 색상 */
        .card-html {
            --accent: #4f8ef7;
            --icon-bg: #1a2a4a;
        }

        .card-css {
            --accent: #c678dd;
            --icon-bg: #3a1e4a;
        }

        .card-js {
            --accent: #e5c07b;
            --icon-bg: #3a2e10;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #3a3f57;
            text-align: center;
        }
    </style>
</head>

<body>

    <p class="top-label">📂 수업 과목 모음</p>
    <h1>웹 개발 <span class="hl">학습 자료</span></h1>
    <p class="desc">과목을 선택하면 해당 인덱스 페이지로 이동합니다</p>

    <div class="cards">

        <a class="card card-html" href="HTML/HtmlIndex.html">
            <div class="icon-wrap">&lt;HTML&gt;</div>
            <div class="card-text">
                <div class="card-title">HTML</div>
                <div class="card-sub">HtmlIndex.html · 태그, 폼, 테이블 등</div>
            </div>
            <span class="card-arrow">→</span>
        </a>

        <a class="card card-css" href="CSS/CssIndex.html">
            <div class="icon-wrap">{ CSS }</div>
            <div class="card-text">
                <div class="card-title">CSS</div>
                <div class="card-sub">CssIndex.html · 스타일시트, 레이아웃 등</div>
            </div>
            <span class="card-arrow">→</span>
        </a>
        <a class="card card-css" href="CSS Design/CssIndex.html">
            <div class="icon-wrap">{ CSS }</div>
            <div class="card-text">
                <div class="card-title">CSS</div>
                <div class="card-sub">CssIndex.html · 스타일시트, 레이아웃 등</div>
            </div>
            <span class="card-arrow">→</span>
        </a>
        <a class="card card-js" href="JavaScript/JavaScriptIndex.html">
            <div class="icon-wrap">JS( )</div>
            <div class="card-text">
                <div class="card-title">JavaScript</div>
                <div class="card-sub">Javascript.html · 함수, 이벤트, DOM 등</div>
            </div>
            <span class="card-arrow">→</span>
        </a>

    </div>

    <footer>파일들과 같은 폴더에 저장하면 링크가 정상 작동합니다</footer>

</body>

</html>
