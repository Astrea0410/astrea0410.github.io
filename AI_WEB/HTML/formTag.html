<!DOCTYPE html>
<html>
<head>
    <title>예제4-1 form input</title>
    <meta charset="utf-8">
</head>
<body>
    <p>폼태그</p>
    <form action="text.jsp" method="post">
        <label for="fname">이름:</label>
        <input type="text" id="fname" name="gname"><br>
        <label for="lname">암호:</label>
        <input type="password"><br>
        라디오버튼:<input type="radio" value="남성">
        <input type="radio" value="여성">
        <input type="radio" value="아동"><br>
        체크박스:<input type="checkbox" value="남성">
        <input type="checkbox" value="여성"><input type="checkbox" value="아동"><br>
        <input type="button" value="남성"><input type="button" value="여성">
    </form>
    <form action="server.jsp" method="get">
        <legend>회원정보</legend>
        <label for="file">파일선택</label>
        <input type="file" id="file"><br>
        <input type="image" id="image"src=""width="40" height="20" alt="전송"><br>
        <label for="search">찾기</label>
        <input type="search" id="search"><br>
        <input type="hidden" id="hidden" value="secretToken123">
        </filedset>
    </form>
</body>
</html>
