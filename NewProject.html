<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="직접 만든 프로젝트의 파일과 기록을 확인하는 New Project 페이지입니다.">
    <title>New Project | 프로젝트 목록</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #120d12;
            --surface: #1d1219;
            --surface-raised: #281720;
            --border: #49232d;
            --accent: #c44a58;
            --accent-light: #e18a92;
            --text: #f5ebed;
            --muted: #bda9ad;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        main {
            width: min(100%, 680px);
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
        }

        .label {
            color: var(--accent-light);
            font-family: "Courier New", monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
        }

        p {
            color: var(--muted);
            line-height: 1.7;
        }

        .project-link {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 14px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }

        .project-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: var(--surface-raised);
        }

        .project-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: rgba(112, 20, 35, 0.3);
            color: var(--accent-light);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .project-info {
            flex: 1;
        }

        .project-info strong {
            display: block;
            margin-bottom: 3px;
        }

        .project-info span {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .arrow {
            color: var(--accent-light);
            font-size: 1.3rem;
        }

        .home-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent-light);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main>
        <div class="label">SECTION 00 · NEW PROJECT</div>
        <h1>New Project</h1>
        <p>직접 만든 프로젝트의 파일과 기록을 확인할 수 있습니다.</p>

        <a class="project-link" href="NPJ.html">
            <span class="project-icon" aria-hidden="true">NPJ</span>
            <span class="project-info">
                <strong>New Project Journal</strong>
                <span>NPJ.html · 프로젝트 과정과 결과 기록</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a class="home-link" href="index.html">← 메인 페이지로 돌아가기</a>
    </main>
</body>

</html>
